name: Complexity Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Run ESLint complexity analysis
        run: npm run lint:complexity
