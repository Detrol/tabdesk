name: release

# Tag-driven release: push v<semver> and this builds the .deb and attaches it to
# a GitHub Release. The CDN host (cdn.thern.io) pulls that release and republishes
# it into its reprepro apt repo — nothing pushes into the CDN. See deploy/README.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # create the Release and upload the .deb asset

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # electron-builder's deb target shells out to these; node-pty needs a
      # native rebuild against Electron's ABI (driven by the postinstall hook).
      - name: System build deps
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install
        run: npm ci

      # The tag (v0.1.1) is the source of truth for the version; keep
      # package.json in lockstep so the built .deb is named to match.
      - name: Sync version to tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          npm version "$ver" --no-git-tag-version --allow-same-version

      - name: Build .deb and tarball
        run: npx electron-builder --linux deb tar.gz --publish never

      # Both assets go on the Release: the .deb is what reprepro republishes,
      # the tarball is the apt-less download the CDN mirrors as a plain file.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
