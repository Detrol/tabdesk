<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#03060f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34e2ff"/>
      <stop offset="1" stop-color="#2b8cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#2b8cff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- terminal window -->
  <rect x="96" y="120" width="320" height="272" rx="26" fill="#060b1c" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="3"/>

  <!-- left tab rail (the app's signature) -->
  <rect x="96" y="120" width="72" height="272" rx="26" fill="#0a1230"/>
  <rect x="120" y="120" width="48" height="272" fill="#0a1230"/>
  <rect x="116" y="156" width="36" height="20" rx="6" fill="url(#accent)"/>
  <rect x="116" y="192" width="36" height="20" rx="6" fill="#2b8cff" fill-opacity="0.4"/>
  <rect x="116" y="228" width="36" height="20" rx="6" fill="#2b8cff" fill-opacity="0.4"/>
  <rect x="116" y="264" width="36" height="20" rx="6" fill="#4ffbdf" fill-opacity="0.6"/>

  <!-- prompt in the main area -->
  <g filter="url(#glow)">
    <path d="M 208 216 L 244 250 L 208 284" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="264" y1="288" x2="336" y2="288" stroke="#eaf4ff" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
