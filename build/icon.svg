<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- TabDesk. The app in one glance: the tab rail down the left, a terminal
       prompt filling the rest. Same palette as the neon theme (#34e2ff cyan,
       #2b8cff blue, near-black navy ground). Built to survive 32px: two shapes,
       high contrast, no nested outlines. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#16255c"/>
      <stop offset="0.45" stop-color="#0a1130"/>
      <stop offset="1" stop-color="#03060f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.24" cy="0.14" r="0.72">
      <stop offset="0" stop-color="#34e2ff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#2b8cff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8fe9ff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#2b8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2b8cff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a44"/>
      <stop offset="1" stop-color="#070d24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0ff"/>
      <stop offset="0.5" stop-color="#34e2ff"/>
      <stop offset="1" stop-color="#2b8cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the tile shape itself, so the rail can run edge to edge -->
    <clipPath id="tileClip">
      <rect x="24" y="24" width="464" height="464" rx="112"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sheen)"/>
  <!-- tab rail: the app's signature. Runs the full height of the tile, like the
       real one does — a band floating in the middle would read as an unfinished
       window instead. -->
  <g clip-path="url(#tileClip)">
    <rect x="24" y="24" width="144" height="464" fill="url(#rail)"/>
    <rect x="165" y="24" width="3" height="464" fill="#34e2ff" fill-opacity="0.4"/>
  </g>

  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5"
        fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- tabs: one live (cyan), one finished (teal), two idle -->
  <g filter="url(#softglow)">
    <rect x="64" y="164" width="76" height="26" rx="13" fill="url(#beam)"/>
  </g>
  <rect x="64" y="212" width="76" height="26" rx="13" fill="#2b8cff" fill-opacity="0.32"/>
  <rect x="64" y="260" width="76" height="26" rx="13" fill="#2b8cff" fill-opacity="0.32"/>
  <rect x="64" y="308" width="76" height="26" rx="13" fill="#4ffbdf" fill-opacity="0.55"/>

  <!-- prompt -->
  <g filter="url(#glow)">
    <path d="M 226 194 L 300 256 L 226 318" fill="none" stroke="url(#beam)"
          stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="326" y="300" width="112" height="24" rx="12" fill="#eaf4ff"/>
  </g>
</svg>
